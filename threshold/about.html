<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>About — YunJin Yi® HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    color-scheme: dark;
    --void: #150B17;
    --deep-plum: #2E1430;
    --plum: #55234C;
    --mauve: #8A6F8C;
    --silver: #C9C4CC;
    --light: #EFECF1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; min-height: 100%;
    background: var(--void);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .mono {
    font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  header {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .wordmark {
    text-transform: uppercase;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--light);
    text-decoration: none;
  }
  .wordmark-sub { color: var(--mauve); margin-left: 8px; }
  .back-link {
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mauve);
    text-decoration: none;
    border: 1px solid var(--mauve);
    border-radius: 4px;
    padding: 8px 16px;
    transition: color 0.12s ease-out, border-color 0.12s ease-out;
  }
  .back-link:hover { color: var(--light); border-color: var(--light); }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }

  .card {
    background: var(--deep-plum);
    border: 1px solid var(--plum);
    border-radius: 4px;
    padding: 40px 24px;
  }

  .name {
    font-size: 24px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--light);
  }
  .name-en { color: var(--mauve); margin-left: 8px; font-size: 18px; }

  .field {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--plum);
  }
  .field-label {
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mauve);
  }
  .field-value {
    margin-top: 8px;
    font-size: 16px;
    line-height: 1.7;
    color: var(--silver);
  }
  .placeholder { color: var(--mauve); }

  footer {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 40px;
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--mauve);
  }
</style>
</head>
<body>

<header>
  <a class="wordmark mono" href="index.html">YunJin Yi&reg;<span class="wordmark-sub">HUB</span></a>
  <a class="back-link mono" href="index.html">Back</a>
</header>

<main>
  <div class="card">
    <div class="name">이윤진 <span class="name-en mono">YunJin Yi</span></div>

    <div class="field">
      <div class="field-label mono">직함 / 한 줄 소개</div>
      <div class="field-value placeholder">준비 중</div>
    </div>

    <div class="field">
      <div class="field-label mono">이메일</div>
      <div class="field-value placeholder">준비 중</div>
    </div>

    <div class="field">
      <div class="field-label mono">외부 링크</div>
      <div class="field-value placeholder">준비 중</div>
    </div>

    <div class="field">
      <div class="field-label mono">이력서</div>
      <div class="field-value placeholder">준비 중</div>
    </div>
  </div>
</main>

<footer class="mono">&copy; 2026 YunJin Yi. All rights reserved.</footer>

</body>
</html>
