<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 운세 — 여덟 장의 카드</title>
<style>
  @keyframes breathe {
    0%, 100% { opacity: .55; transform: scale(1); }
    50%      { opacity: .9;  transform: scale(1.04); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: .25; }
    50%      { opacity: 1; }
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes sweep {
    from { transform: translateX(-120%) skewX(-12deg); }
    to   { transform: translateX(220%)  skewX(-12deg); }
  }

  :root {
    --bg-void:      #0a0710;
    --bg-void-2:    #100b1c;
    --bg-panel:     #150f22;
    --bg-panel-2:   #1c1430;
    --bg-panel-3:   #241a3a;

    --gold-dim:     #7a6335;
    --gold:         #c9a24b;
    --gold-bright:  #f2d998;
    --gold-line:    rgba(201, 162, 75, .35);

    --violet:       #6a4fb0;
    --violet-soft:  rgba(106, 79, 176, .28);
    --teal:         #2f6f6a;

    --text-primary:   #ede6d8;
    --text-secondary: #a89bc4;
    --text-muted:     #6e6288;

    --font-display: "Noto Serif KR", "Nanum Myeongjo", "Batangche", serif;
    --font-body: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Consolas", "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100%;
  }

  body {
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, var(--violet-soft), transparent 65%),
      radial-gradient(ellipse 50% 35% at 85% 90%, rgba(47,111,106,.18), transparent 60%),
      var(--bg-void);
    min-height: 100vh;
  }

  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: clamp(2.5rem, 6vw, 5rem) 1.5rem 5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header.hero {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .9rem;
    margin-bottom: clamp(2.5rem, 5vw, 3.5rem);
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: .72rem;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    gap: .6em;
  }
  .eyebrow::before, .eyebrow::after {
    content: "";
    width: 22px;
    height: 1px;
    background: var(--gold-dim);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.1rem, 5vw, 3.3rem);
    letter-spacing: .04em;
    margin: 0;
    color: var(--gold-bright);
    text-shadow: 0 0 28px rgba(242, 217, 152, .28), 0 0 2px rgba(242,217,152,.4);
    text-wrap: balance;
  }

  .subtitle {
    max-width: 34em;
    color: var(--text-secondary);
    font-size: 1rem;
    line-height: 1.7;
    margin: 0;
    text-wrap: balance;
  }

  .today {
    font-family: var(--font-mono);
    font-size: .78rem;
    letter-spacing: .06em;
    color: var(--text-muted);
    border: 1px solid var(--gold-line);
    border-radius: 999px;
    padding: .35em 1.1em;
    background: rgba(201,162,75,.05);
  }

  .instruction {
    font-size: .88rem;
    color: var(--text-muted);
    margin: 1.6rem 0 1.4rem;
    letter-spacing: .02em;
    height: 1.2em;
    transition: opacity .4s ease;
  }
  .instruction.is-hidden { opacity: 0; }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: clamp(.6rem, 1.6vw, 1.1rem);
    width: 100%;
    perspective: 1400px;
  }

  @media (max-width: 780px) {
    .cards-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 420px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    all: unset;
    cursor: pointer;
    aspect-ratio: 5 / 8;
    position: relative;
    display: block;
    transition: transform .3s ease, opacity .5s ease;
  }
  .card:focus-visible .card-face {
    outline: 2px solid var(--gold-bright);
    outline-offset: 3px;
  }
  .card:hover:not(.is-flipped):not(.is-locked) { transform: translateY(-6px); }

  .card.is-locked {
    cursor: default;
    opacity: .32;
    transform: none !important;
  }

  .card-inner {
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform .85s cubic-bezier(.4, .1, .2, 1);
    transform-style: preserve-3d;
  }
  .card.is-flipped .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 3px;
    border: 1px solid var(--gold-line);
    overflow: hidden;
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  }

  .card-back {
    background:
      repeating-linear-gradient(135deg, rgba(201,162,75,.05) 0 2px, transparent 2px 10px),
      linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel) 70%);
    display: grid;
    place-items: center;
  }
  .card-back::before, .card-back::after {
    content: "";
    position: absolute;
    width: 16px; height: 16px;
    border: 1px solid var(--gold-dim);
  }
  .card-back::before { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
  .card-back::after  { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

  .card-emblem {
    display: block;
    width: 22px; height: 22px;
    border: 1px solid var(--gold);
    transform: rotate(45deg);
    position: relative;
    opacity: .8;
  }
  .card-emblem::after {
    content: "";
    position: absolute;
    inset: 40%;
    background: var(--gold-bright);
    border-radius: 50%;
  }

  .card:hover:not(.is-flipped):not(.is-locked) .card-back { border-color: var(--gold); }
  .card:hover:not(.is-flipped):not(.is-locked) .shimmer { opacity: 1; }

  .shimmer {
    position: absolute;
    inset: -20% -60%;
    background: linear-gradient(90deg, transparent, rgba(242,217,152,.16), transparent);
    opacity: 0;
    animation: sweep 1.3s ease forwards;
  }

  .card-front {
    transform: rotateY(180deg);
    background: radial-gradient(circle at 50% 32%, var(--bg-panel-3), var(--bg-panel) 75%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    padding: .6rem;
    text-align: center;
  }

  .card-front svg {
    width: clamp(20px, 4vw, 30px);
    height: clamp(20px, 4vw, 30px);
    stroke: var(--gold-bright);
    filter: drop-shadow(0 0 8px rgba(242, 217, 152, .5));
  }

  .card-front .symbol-name {
    font-family: var(--font-display);
    font-size: clamp(.68rem, 1.6vw, .82rem);
    color: var(--text-secondary);
    letter-spacing: .04em;
  }

  .result {
    width: 100%;
    max-width: 620px;
    margin-top: clamp(2.4rem, 6vw, 3.6rem);
    border: 1px solid var(--gold-line);
    background: linear-gradient(180deg, rgba(28,20,48,.7), rgba(21,15,34,.85));
    border-radius: 4px;
    padding: clamp(1.6rem, 4vw, 2.6rem);
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1.1rem;
    animation: rise-in .6s ease both;
  }
  .result.is-visible { display: flex; }
  .result:focus { outline: none; }

  .result-icon {
    width: 46px; height: 46px;
    stroke: var(--gold-bright);
    filter: drop-shadow(0 0 14px rgba(242, 217, 152, .55));
  }

  .result-eyebrow {
    font-family: var(--font-mono);
    font-size: .7rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .result h2 {
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 3.4vw, 1.9rem);
    color: var(--gold-bright);
    margin: 0;
    text-wrap: balance;
  }

  .result p.body-text {
    color: var(--text-primary);
    line-height: 1.85;
    font-size: 1rem;
    max-width: 42em;
    margin: 0;
  }

  .stat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 1.4rem 2.2rem;
    justify-content: center;
    margin-top: .4rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--gold-line);
    width: 100%;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .35rem;
    min-width: 90px;
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: .64rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .stat-value {
    font-family: var(--font-mono);
    font-size: 1.15rem;
    color: var(--gold-bright);
    font-variant-numeric: tabular-nums;
    display: inline-flex;
    align-items: center;
    gap: .5em;
  }

  .swatch {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    display: inline-block;
  }

  .redraw {
    all: unset;
    cursor: pointer;
    margin-top: .6rem;
    font-family: var(--font-mono);
    font-size: .78rem;
    letter-spacing: .12em;
    color: var(--gold-bright);
    border: 1px solid var(--gold);
    padding: .7em 1.6em;
    border-radius: 999px;
    transition: background .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .redraw:hover, .redraw:focus-visible {
    background: var(--gold);
    color: var(--bg-void);
    box-shadow: 0 0 20px rgba(201,162,75,.4);
  }
  .redraw:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }

  footer.note {
    margin-top: 3rem;
    font-size: .76rem;
    color: var(--text-muted);
    letter-spacing: .02em;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas" aria-hidden="true"></canvas>

<div class="stage">
  <header class="hero">
    <span class="eyebrow">DIVINATION · 오늘의 카드</span>
    <h1>오늘의 운세</h1>
    <p class="subtitle">여덟 장의 카드 중 마음이 이끄는 하나를 골라보세요.<br>오늘 당신에게 필요한 메시지가 그 안에 있습니다.</p>
    <span class="today" id="today-date"></span>
  </header>

  <p class="instruction" id="instruction">카드 한 장을 선택하세요</p>

  <div class="cards-grid" id="cards-grid" role="group" aria-label="운세 카드 여덟 장"></div>

  <section class="result" id="result" tabindex="-1" aria-live="polite">
    <svg id="result-icon" class="result-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><use id="result-icon-use" href="#icon-moon"></use></svg>
    <span class="result-eyebrow" id="result-eyebrow">CARD · I</span>
    <h2 id="result-title">차오르는 달</h2>
    <p class="body-text" id="result-text"></p>
    <div class="stat-row">
      <div class="stat">
        <span class="stat-label">행운의 색</span>
        <span class="stat-value"><span class="swatch" id="result-swatch"></span><span id="result-color-name"></span></span>
      </div>
      <div class="stat">
        <span class="stat-label">행운의 숫자</span>
        <span class="stat-value" id="result-number"></span>
      </div>
      <div class="stat">
        <span class="stat-label">오늘의 키워드</span>
        <span class="stat-value" id="result-keyword"></span>
      </div>
    </div>
    <button class="redraw" id="redraw-btn">다시 뽑기</button>
  </section>

  <footer class="note">※ 오늘의 운세는 재미로 즐겨주세요.</footer>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="icon-moon"><path d="M16 3a9 9 0 1 0 0 18 7 7 0 1 1 0-18z"/></g>
    <g id="icon-star"><path d="M12 2 L13.4 9.6 L21 12 L13.4 14.4 L12 22 L10.6 14.4 L3 12 L10.6 9.6 Z"/></g>
    <g id="icon-sun"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="19.6" y2="4.4"/></g>
    <g id="icon-eye"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></g>
    <g id="icon-key"><circle cx="8" cy="8" r="4.2"/><line x1="11" y1="11" x2="20.5" y2="20.5"/><line x1="16.2" y1="15.7" x2="18.6" y2="13.3"/><line x1="18.2" y1="17.7" x2="20.2" y2="15.7"/></g>
    <g id="icon-mirror"><ellipse cx="12" cy="9.5" rx="6" ry="7.5"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="8.7" y1="22" x2="15.3" y2="22"/></g>
    <g id="icon-feather"><path d="M20 4c-6 1-13 6-13 13 0 1.5.3 2.5.3 2.5s1-.3 2.5-.3C16.5 19.2 21 12 20 4z"/><line x1="7.3" y1="19.5" x2="20" y2="4"/></g>
    <g id="icon-compass"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/><line x1="12" y1="2.5" x2="12" y2="4.2"/><line x1="12" y1="19.8" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="4.2" y2="12"/><line x1="19.8" y1="12" x2="21.5" y2="12"/></g>
  </defs>
</svg>

<script>
(function () {
  "use strict";

  var SYMBOLS = [
    {
      id: "moon", name: "달", icon: "icon-moon",
      variants: [
        { title: "차오르는 달", text: "오늘의 마음은 차오르는 달처럼 서서히 채워집니다. 미뤄왔던 대화를 다시 꺼내보세요. 예상보다 부드럽게 풀려나갈 실마리가 보입니다.", color: { name: "남색", hex: "#2c2a5e" }, number: 17, keyword: "고요" },
        { title: "숨어드는 달", text: "구름 뒤에 숨은 달처럼, 오늘은 드러내기보다 지켜보는 편이 이롭습니다. 조급한 결정은 잠시 미루고 저녁의 고요함 속에서 답을 찾으세요.", color: { name: "쪽빛", hex: "#243b6b" }, number: 3, keyword: "관망" }
      ]
    },
    {
      id: "star", name: "별", icon: "icon-star",
      variants: [
        { title: "가장 먼 별", text: "밤하늘 가장 먼 별의 빛도 결국 당신께 닿습니다. 작게 시작한 일이 뜻밖의 곳에서 반짝임을 얻는 하루, 포기하려던 계획을 한 번 더 붙잡아보세요.", color: { name: "은빛", hex: "#c7ccd6" }, number: 8, keyword: "가능성" },
        { title: "길잡이 별", text: "여러 갈래 앞에서 길을 잃었다면 가장 밝은 별 하나만 따라가세요. 오늘은 직감이 가리키는 단 하나에 집중할 때, 나머지는 저절로 정리됩니다.", color: { name: "청록빛", hex: "#3d7a8c" }, number: 21, keyword: "직감" }
      ]
    },
    {
      id: "sun", name: "태양", icon: "icon-sun",
      variants: [
        { title: "정오의 태양", text: "정오의 태양처럼 감출 수 없는 존재감이 빛나는 날입니다. 미뤄둔 제안을 먼저 꺼내보세요. 주도권은 이미 당신 쪽으로 기울어 있습니다.", color: { name: "호박빛", hex: "#c97a2b" }, number: 1, keyword: "결단" },
        { title: "떠오르는 해", text: "떠오르는 해는 어제의 그림자를 지웁니다. 마음에 걸리던 오해나 앙금을 오늘 정리하면 그 홀가분함이 오래도록 남습니다.", color: { name: "주홍빛", hex: "#b5461f" }, number: 5, keyword: "새출발" }
      ]
    },
    {
      id: "eye", name: "눈", icon: "icon-eye",
      variants: [
        { title: "안쪽을 보는 눈", text: "눈에 보이는 것보다 한 겹 안쪽을 보게 되는 날입니다. 상대의 말보다 표정과 침묵에 진심이 담겨 있으니 서두르지 말고 관찰하세요.", color: { name: "자수정빛", hex: "#6b4b9e" }, number: 11, keyword: "통찰" },
        { title: "낯선 것을 알아채는 눈", text: "익숙한 풍경 속에서 낯선 디테일 하나가 눈에 띕니다. 사소해 보이는 그 발견이 나중에는 중요한 단서가 되어 돌아옵니다.", color: { name: "짙은 보랏빛", hex: "#4a3363" }, number: 19, keyword: "발견" }
      ]
    },
    {
      id: "key", name: "열쇠", icon: "icon-key",
      variants: [
        { title: "뜻밖의 열쇠", text: "굳게 닫혀 있던 문 하나가 오늘은 예상 밖의 열쇠로 열립니다. 오래 미뤄둔 질문을 다시 꺼내보면 뜻밖의 답을 얻습니다.", color: { name: "고동빛", hex: "#7a5230" }, number: 6, keyword: "기회" },
        { title: "고르는 열쇠", text: "모든 문을 열 필요는 없습니다. 오늘은 꼭 필요한 문 하나만 정확히 골라 여는 지혜가 필요한 날입니다.", color: { name: "황동빛", hex: "#9c7a3c" }, number: 14, keyword: "선택" }
      ]
    },
    {
      id: "mirror", name: "거울", icon: "icon-mirror",
      variants: [
        { title: "속마음의 거울", text: "타인에게서 발견한 단점이 사실은 나의 거울일 수 있습니다. 오늘의 짜증이나 부러움을 가만히 들여다보면 원하는 것이 선명해집니다.", color: { name: "진주빛", hex: "#d8cdd9" }, number: 22, keyword: "성찰" },
        { title: "어제와 오늘의 거울", text: "거울 속 나를 오래 바라보는 하루입니다. 남과 비교하기보다 어제의 나와 오늘의 나를 견주어보면, 생각보다 많이 나아갔음을 알게 됩니다.", color: { name: "옅은 라벤더빛", hex: "#a99cc4" }, number: 7, keyword: "비교" }
      ]
    },
    {
      id: "feather", name: "깃털", icon: "icon-feather",
      variants: [
        { title: "가벼워지는 깃털", text: "무겁게 짊어졌던 걱정 하나를 오늘은 깃털처럼 가볍게 내려놓아도 좋습니다. 완벽하지 않아도 괜찮다는 확인을 받는 날입니다.", color: { name: "상아빛", hex: "#e8dfc4" }, number: 9, keyword: "여유" },
        { title: "바람을 탄 깃털", text: "바람을 탄 깃털처럼, 계획보다 흐름에 몸을 맡길 때 더 좋은 결과가 옵니다. 오늘은 지도보다 감각을 믿어보세요.", color: { name: "밀빛", hex: "#c9a35c" }, number: 16, keyword: "흐름" }
      ]
    },
    {
      id: "compass", name: "나침반", icon: "icon-compass",
      variants: [
        { title: "제자리를 찾는 바늘", text: "방향을 잃은 것처럼 느껴져도 나침반 바늘은 결국 제자리를 찾습니다. 잠시 멈춰 방향을 재는 것도 전진의 한 방법입니다.", color: { name: "에메랄드빛", hex: "#2f7a5c" }, number: 14, keyword: "균형" },
        { title: "마음이 가리키는 방향", text: "여러 갈래 길 앞에서 망설이고 있다면, 오늘은 마음이 가장 먼저 향한 곳을 믿어보세요. 나침반은 이미 그곳을 가리키고 있습니다.", color: { name: "짙은 청록빛", hex: "#1f5c56" }, number: 4, keyword: "결심" }
      ]
    }
  ];

  var ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
  var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var grid = document.getElementById("cards-grid");
  var instruction = document.getElementById("instruction");
  var result = document.getElementById("result");
  var redrawBtn = document.getElementById("redraw-btn");
  var cardsState = [];

  function shuffledDeck() {
    var deck = SYMBOLS.map(function (sym) {
      var v = sym.variants[Math.floor(Math.random() * sym.variants.length)];
      return { symbol: sym, variant: v };
    });
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
    }
    return deck;
  }

  function buildCards() {
    grid.innerHTML = "";
    cardsState = shuffledDeck();

    cardsState.forEach(function (entry, idx) {
      var card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.setAttribute("aria-label", "카드 " + (idx + 1) + "번, 아직 공개되지 않음");
      card.dataset.index = String(idx);

      card.innerHTML =
        '<span class="card-inner">' +
          '<span class="card-face card-back"><span class="shimmer" style="animation:none;opacity:0"></span><span class="card-emblem"></span></span>' +
          '<span class="card-face card-front">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><use href="#' + entry.symbol.icon + '"></use></svg>' +
            '<span class="symbol-name">' + entry.symbol.name + '</span>' +
          '</span>' +
        '</span>';

      card.addEventListener("click", function () { pickCard(idx, card); });
      card.addEventListener("mouseenter", function () {
        if (prefersReducedMotion || card.classList.contains("is-flipped") || card.classList.contains("is-locked")) return;
        var s = card.querySelector(".shimmer");
        s.style.animation = "none";
        void s.offsetWidth;
        s.style.animation = "sweep 1.1s ease forwards";
      });

      grid.appendChild(card);
    });
  }

  function pickCard(idx, card) {
    if (result.classList.contains("is-visible")) return;
    var entry = cardsState[idx];
    var allCards = Array.prototype.slice.call(grid.children);

    card.classList.add("is-flipped");
    allCards.forEach(function (c) {
      if (c !== card) c.classList.add("is-locked");
      c.setAttribute("aria-disabled", "true");
    });
    instruction.classList.add("is-hidden");

    var reveal = function () {
      document.getElementById("result-icon-use").setAttribute("href", "#" + entry.symbol.icon);
      document.getElementById("result-eyebrow").textContent = "CARD · " + ROMAN[idx] + " · " + entry.symbol.name;
      document.getElementById("result-title").textContent = entry.variant.title;
      document.getElementById("result-text").textContent = entry.variant.text;
      document.getElementById("result-swatch").style.background = entry.variant.color.hex;
      document.getElementById("result-color-name").textContent = entry.variant.color.name;
      document.getElementById("result-number").textContent = entry.variant.number;
      document.getElementById("result-keyword").textContent = entry.variant.keyword;

      result.classList.add("is-visible");
      result.focus();
      result.scrollIntoView({ behavior: prefersReducedMotion ? "auto" : "smooth", block: "nearest" });
    };

    if (prefersReducedMotion) {
      reveal();
    } else {
      setTimeout(reveal, 420);
    }
  }

  function reset() {
    result.classList.remove("is-visible");
    instruction.classList.remove("is-hidden");
    buildCards();
  }

  redrawBtn.addEventListener("click", reset);

  document.getElementById("today-date").textContent = new Intl.DateTimeFormat("ko-KR", {
    year: "numeric", month: "long", day: "numeric", weekday: "long"
  }).format(new Date());

  buildCards();

  // ambient starfield
  var canvas = document.getElementById("bg-canvas");
  var ctx = canvas.getContext("2d");
  var stars = [];
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var count = Math.floor((window.innerWidth * window.innerHeight) / 9000);
    stars = [];
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.1 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.8,
        gold: Math.random() < 0.18
      });
    }
  }

  function drawStatic() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    stars.forEach(function (s) {
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = s.gold ? "#f2d998" : "#cfc6e8";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  var t = 0;
  function drawFrame() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    t += 0.016;
    stars.forEach(function (s) {
      var tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
      ctx.globalAlpha = tw;
      ctx.fillStyle = s.gold ? "#f2d998" : "#cfc6e8";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawFrame);
  }

  resize();
  window.addEventListener("resize", resize);
  if (prefersReducedMotion) {
    drawStatic();
  } else {
    requestAnimationFrame(drawFrame);
  }
})();
</script>
</body>
</html>
